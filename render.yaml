# render.yaml
# Render Blueprint Specification for automated deployment

services:
  - type: web
    name: realtime-object-detection
    env: docker
    plan: free
    region: oregon
    branch: main
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_TYPE
        value: yolov3-tiny
      - key: MODEL_NAME
        value: yolov3-tiny
      - key: DOWNLOAD_FULL_YOLO
        value: "false"
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: NMS_THRESHOLD
        value: "0.45"
      - key: ENABLE_PREPROCESS
        value: "false"
