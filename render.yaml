# render.yaml
# Render Blueprint Specification for automated deployment

services:
  - type: web
    name: vision-assistant
    env: docker
    plan: free
    region: oregon # Default robust region
    branch: main
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_TYPE
        value: yolov3-tiny
      - key: DOWNLOAD_FULL_YOLO
        value: "false"
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: NMS_THRESHOLD
        value: "0.4"
